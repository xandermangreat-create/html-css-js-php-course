<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 4: Tables and Lists</title>
</head>
<body>
    <h1>Lesson 4: Tables and Lists</h1>
    <h2>Table Example</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Jane</td>
                <td>28</td>
            </tr>
        </tbody>
    </table>
    <!-- Task: Add another row with your details -->
    
    <h2>List Example</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <!-- Task: Add another item to the list -->
</body>
</html>
